name: Panticonic native release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag (for example v1.1.1-panticonic.1)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: panticonic-native-release
  cancel-in-progress: false

jobs:
  android:
    name: Build Android bindings
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: davidB/rust-cargo-make@v1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android NDK
        uses: android-actions/setup-android@v3
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          add-to-path: true
      - name: Build Android native libraries
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          cargo install --version 3.5.4 cargo-ndk --locked
          cargo ndk -o android-jniLibs \
            -t armeabi-v7a -t arm64-v8a -t x86 -t x86_64 \
            build --release --lib -p iroh-ffi
      - name: Generate bindings and assemble artifacts
        run: |
          bash scripts/stage_android_natives.sh
          kotlin/gradlew -p kotlin :lib:jar :android:assembleRelease
          cp kotlin/lib/build/libs/lib.jar iroh-kotlin-${{ inputs.version }}.jar
          cp kotlin/android/build/outputs/aar/android-release.aar iroh-android-${{ inputs.version }}.aar
      - name: Verify Android archive contents
        run: |
          unzip -l iroh-android-${{ inputs.version }}.aar | grep 'jni/arm64-v8a/libiroh_ffi.so'
          unzip -l iroh-android-${{ inputs.version }}.aar | grep 'jni/x86_64/libiroh_ffi.so'
          jar tf iroh-kotlin-${{ inputs.version }}.jar | grep 'computer/iroh/Endpoint.class'
      - uses: actions/upload-artifact@v4
        with:
          name: panticonic-android
          path: |
            iroh-android-${{ inputs.version }}.aar
            iroh-kotlin-${{ inputs.version }}.jar
          if-no-files-found: error
          retention-days: 7

  apple:
    name: Build Apple XCFramework
    # netdev links Network.framework symbols introduced in the iOS 18 SDK.
    # macOS 15 hosted runners provide Xcode 16 and that SDK.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,aarch64-apple-ios-macabi
      - uses: Swatinem/rust-cache@v2
      - uses: davidB/rust-cargo-make@v1
      - name: Build and verify XCFramework
        run: |
          cargo make swift-xcframework
          cargo make verify-swift-xcframework
          bash scripts/release/zip_xcframework.sh
          mv IrohLib.xcframework.zip IrohLib-${{ inputs.version }}.xcframework.zip
      - uses: actions/upload-artifact@v4
        with:
          name: panticonic-apple
          path: IrohLib-${{ inputs.version }}.xcframework.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish immutable native artifacts
    needs: [android, apple]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Validate version and bake Swift package checksum
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*-panticonic.[0-9]*) ;;
            *) echo "Invalid release tag: $RELEASE_TAG" >&2; exit 1 ;;
          esac
          if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "Release tag already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          APPLE_ASSET="IrohLib-$RELEASE_TAG.xcframework.zip"
          CHECKSUM=$(sha256sum "release-assets/$APPLE_ASSET" | cut -d' ' -f1)
          sed -i -E "s|let releaseTag = \"[^\"]+\"|let releaseTag = \"$RELEASE_TAG\"|" Package.swift
          sed -i -E "s|let releaseChecksum = \"[^\"]+\"|let releaseChecksum = \"$CHECKSUM\"|" Package.swift
          sed -i 's|https://github.com/n0-computer/iroh-ffi/releases/download/|https://github.com/panticonic/iroh-ffi/releases/download/|' Package.swift
          sha256sum release-assets/* > release-assets/SHA256SUMS
          git diff --check
      - name: Commit release manifest and tag
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Package.swift
          git commit -m "release: $RELEASE_TAG"
          git tag -a "$RELEASE_TAG" -m "$RELEASE_TAG"
          git push origin HEAD:main "$RELEASE_TAG"
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          generate_release_notes: true
          files: |
            release-assets/*
          fail_on_unmatched_files: true
